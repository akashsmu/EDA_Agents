[tool.poetry]
name = "eda-agents"
version = "0.1.0"
description = "Agentic framework for data ingestion and analysis using Streamlit, LangChain, and LangGraph."
authors = ["Akash <akash@example.com>"]
readme = "README.md"
packages = [{include = "eda_agents", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.31.0"
langchain = "^0.1.0"
langgraph = "^0.0.10"
openai = "^1.12.0"
pandas = "^2.2.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
plotly = "^5.18.0"
openpyxl = "^3.1.2"
python-dotenv = "^1.0.1"
sweetviz = "^2.3.1"
missingno = "^0.5.2"
dtale = "^3.9.0"
plotnine = "^0.12.1"
pytimetk = "^0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
